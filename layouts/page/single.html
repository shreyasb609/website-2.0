{{ define "main" }}
  <div class="elevate-page-content">
    {{ if isset .Params "id" }}
      {{ $partialID := .Params.id }}
      {{ if not (strings.HasSuffix $partialID ".html") }}
        {{ $partialID = printf "%s.html" $partialID }}
      {{ end }}
      {{ partial $partialID . }}
    {{ else }}
      <div class="page-body">
        {{ .Content }}
      </div>
    {{ end }}
  </div>
{{ end }}
