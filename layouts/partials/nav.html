<header class="navbar-affixed-top" data-spy="affix" data-offset-top="62">
    <div class="navbar navbar-default yamm" role="navigation" id="navbar">
        <div class="container">
            <div class="navbar-header">
                <a class="navbar-brand home" href="{{ "/" | relLangURL }}">
                    <i class="fas fa-graduation-cap"></i>
                    <span>Elevate</span>
                </a>
                <div class="navbar-buttons">
                    <button type="button" class="navbar-toggle btn-template-main" data-toggle="collapse" data-target="#navigation">
                        <span class="sr-only">Toggle Navigation</span>
                        <i class="fas fa-bars"></i>
                    </button>
                </div>
            </div>
            <!--/.navbar-header -->

            <div class="navbar-collapse collapse" id="navigation">
                <ul class="nav navbar-nav navbar-right">
                    {{ $current := . }}
                    {{ range .Site.Menus.main.ByWeight }}
                        {{ if eq .Name "Home" }}{{ continue }}{{ end }}
                        {{ $active := "" }}
                        {{ if eq $current.RelPermalink .URL }}
                            {{ $active = "active" }}
                        {{ end }}
                        <li class="{{ $active }}">
                            <a href="{{ .URL | relURL }}">{{ .Name }}</a>
                        </li>
                    {{ end }}
                    <li style="display:flex;align-items:center;padding-left:8px;">
                        <a href="{{ "/get-tutored/" | relURL }}" class="btn btn-template-main" style="margin: 14px 0; padding: 8px 18px; font-size: 13.5px;">
                            Get Tutored
                        </a>
                    </li>
                </ul>
            </div>
            <!--/.nav-collapse -->
        </div>
    </div>
</header>
