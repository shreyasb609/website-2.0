<header class="navbar-affixed-top" data-spy="affix" data-offset-top="62">
    <div class="navbar navbar-default yamm" role="navigation" id="navbar">
        <div class="container">
            <div class="navbar-header">
                <a class="navbar-brand home" href="{{ "/" | relLangURL }}" style="font-size: 22px; font-weight: 800; color: #338dbd; text-decoration: none; padding: 15px 15px; display: inline-flex; align-items: center; gap: 8px;">
                    <i class="fas fa-graduation-cap"></i> <span>Elevate Tutoring</span>
                </a>
                <div class="navbar-buttons">
                    <button type="button" class="navbar-toggle btn-template-main" data-toggle="collapse" data-target="#navigation">
                        <span class="sr-only">Toggle Navigation</span>
                        <i class="fas fa-align-justify"></i>
                    </button>
                </div>
            </div>
            <!--/.navbar-header -->

            <div class="navbar-collapse collapse" id="navigation">
                <ul class="nav navbar-nav navbar-right">
                    {{ $current := . }}
                    {{ range .Site.Menus.main.ByWeight }}
                        {{ $active := "" }}
                        {{ if eq $current.RelPermalink .URL }}
                            {{ $active = "active" }}
                        {{ end }}
                        <li class="{{ $active }}">
                            <a href="{{ .URL | relURL }}">{{ .Name }}</a>
                        </li>
                    {{ end }}
                </ul>
            </div>
            <!--/.nav-collapse -->
        </div>
    </div>
</header>
