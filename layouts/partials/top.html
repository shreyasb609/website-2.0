{{ if .Site.Params.topbar.enable }}
<div id="top">
  <div class="container">
    <div class="top-bar-wrapper">
      
      <!-- Left side: Value proposition / announcement -->
      <div class="top-bar-left">
        {{ .Site.Params.topbar.text | safeHTML }}
      </div>

      <!-- Right side: Centered icons for Email and Elevate logo -->
      <div class="top-bar-right">
        <a href="mailto:info@elevatetutoring.com" title="Email Us (info@elevatetutoring.com)" class="top-icon-btn">
          <i class="fas fa-envelope"></i>
        </a>
        <a href="{{ "get-tutored/" | relURL }}" title="Request a Tutor" class="top-icon-btn">
          <i class="fas fa-graduation-cap"></i>
        </a>
      </div>

    </div>
  </div>
</div>
{{ end }}
