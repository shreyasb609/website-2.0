baseURL: "https://shreyasb609.github.io/website-2.0/"
title: "Elevate Tutoring"
theme: "techly"
defaultContentLanguage: "en"
summaryLength: 70
pluralizelisttitles: false

locale: "en-us"

outputs:
  home: ["HTML", "RSS", "JSON"]

menu:
  main:
    - name: "Home"
      url: "/"
      weight: 1
    - name: "About"
      url: "/about/"
      weight: 2
    - name: "Programs"
      url: "/about/#subjects"
      weight: 3
    - name: "Study Topics"
      url: "/resources/"
      weight: 4
    - name: "FAQ"
      url: "/faq/"
      weight: 5
    - name: "Contact"
      url: "/contact/"
      weight: 6

params:
  author:
    name: "Elevate Tutoring Team"
  description: "Elevate is a premier tutoring service offering personalized 1-on-1 instruction, test prep, and STEM mentorship."
  defaultKeywords: ["tutoring", "STEM", "math", "calculus", "SAT prep", "ACT prep", "AP exams", "coding", "python", "mentorship"]
  mainSections: ["posts"]
  indexHome: true

  banner:
    heading: "Elevate Tutoring"
    subheading: "Expert tutors, personalized plans, and proven results for K-12 math, sciences, test prep, coding, and beyond."

  footer:
    tagline: "Personalized 1-on-1 mentorship for K-12, AP exams, SAT/ACT, and coding."
    copyright: "Elevate Tutoring. All rights reserved."
    since: 2024
    showSocial: false

  contact_url: "/contact/"

  enableGoogleMaps: false
  formspree_action: ""
  contact_form_ajax: false
  enableRecaptchaInContactForm: false

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 3
