baseURL: https://shreyasb609.github.io/website/
locale: en-us
defaultContentLanguage: en
title: "Elevate Tutoring | Empowering Academic Success"
theme: "PaperMod"
buildFuture: true

pagination:
  pageSize: 10

outputs:
  home:
    - HTML
    - JSON

sitemap:
  changefreq: weekly
  priority: 0.5
  filename: sitemap.xml

params:
  enableIntegrity: false
  description: "Elevate is a premier tutoring service offering personalized 1-on-1 instruction, test prep, and STEM specialization."
  author: "Elevate Tutoring Team"
  heroTitleLine1: "Elevate"
  heroTitleLine2: "Personalized Tutoring & Mentorship"
  footerText: "© 2026 Elevate Tutoring. All rights reserved."
  math: false
  
  # PaperMod / Theme settings
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true

  homeInfoParams:
    Title: "Elevate Your Learning Potential"
    Content: "Expert 1-on-1 tutoring, test preparation, and academic mentorship tailored to every student's unique goals."

menus:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 10
    - identifier: about
      name: Purpose & What We Do
      url: /about/
      weight: 20
    - identifier: get-tutored
      name: Get Tutored
      url: /get-tutored/
      weight: 30
    - identifier: join
      name: Join as a Tutor
      url: /join/
      weight: 40

markup:
  tableOfContents:
    startLevel: 1
    endLevel: 6
    ordered: false
  goldmark:
    renderer:
      unsafe: true
